openapi: 3.0.3
info:
  title: Go Users, Roles and Authentication API
  version: 1.0.0
  description: CRUD de usuarios y roles, autenticación con tokens Bearer y PostgreSQL.
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
  - name: Roles
  - name: Users
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Usuario registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar una sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/me:
    get:
      tags: [Auth]
      summary: Obtener el usuario autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /roles:
    get:
      tags: [Roles]
      summary: Listar roles activos
      responses:
        "200":
          description: Lista de roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Roles]
      summary: Crear un rol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "201":
          description: Rol creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /roles/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Roles]
      summary: Obtener un rol
      responses:
        "200":
          description: Rol encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Roles]
      summary: Actualizar un rol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "200":
          description: Rol actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Roles]
      summary: Eliminar lógicamente un rol
      responses:
        "200":
          description: Rol eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /users:
    get:
      tags: [Users]
      summary: Listar usuarios activos
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Users]
      summary: Crear un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Users]
      summary: Obtener un usuario
      responses:
        "200":
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Users]
      summary: Actualizar un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "200":
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Users]
      summary: Eliminar lógicamente un usuario
      responses:
        "200":
          description: Usuario eliminado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ID:
      name: id
      in: path
      required: true
      description: Identificador positivo del recurso
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    RegisterInput:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Ada Lovelace
        email:
          type: string
          format: email
          example: ada@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: secret123
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: ada@example.com
        password:
          type: string
          format: password
          example: secret123
    RegisteredUser:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        name:
          type: string
    RoleInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          example: admin
    Role:
      allOf:
        - $ref: "#/components/schemas/RoleInput"
        - type: object
          required: [id, created_at, updated_at]
          properties:
            id:
              type: integer
              format: int64
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            deleted_at:
              type: string
              format: date-time
              nullable: true
    UserInput:
      type: object
      additionalProperties: false
      required: [role_id, name, email]
      properties:
        role_id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          example: Ada Lovelace
        email:
          type: string
          format: email
          example: ada@example.com
    User:
      allOf:
        - $ref: "#/components/schemas/UserInput"
        - type: object
          required: [id, created_at, updated_at]
          properties:
            id:
              type: integer
              format: int64
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            deleted_at:
              type: string
              format: date-time
              nullable: true
    ErrorDetail:
      type: object
      required: [message]
      properties:
        field:
          type: string
          example: email
        message:
          type: string
          example: email is required
    RoleResponse:
      type: object
      required: [data, success, status, errors]
      properties:
        data:
          $ref: "#/components/schemas/Role"
        success:
          type: boolean
          enum: [true]
        status:
          type: integer
          example: 200
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
          maxItems: 0
    RoleListResponse:
      type: object
      required: [data, success, status, errors]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        success:
          type: boolean
          enum: [true]
        status:
          type: integer
          example: 200
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
          maxItems: 0
    UserResponse:
      type: object
      required: [data, success, status, errors]
      properties:
        data:
          $ref: "#/components/schemas/User"
        success:
          type: boolean
          enum: [true]
        status:
          type: integer
          example: 200
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
          maxItems: 0
    UserListResponse:
      type: object
      required: [data, success, status, errors]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        success:
          type: boolean
          enum: [true]
        status:
          type: integer
          example: 200
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
          maxItems: 0
    RegisterResponse:
      type: object
      required: [data, success, status, errors]
      properties:
        data:
          $ref: "#/components/schemas/RegisteredUser"
        success:
          type: boolean
          enum: [true]
        status:
          type: integer
          example: 201
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
          maxItems: 0
    TokenResponse:
      type: object
      required: [data, success, status, errors]
      properties:
        data:
          type: object
          required: [token]
          properties:
            token:
              type: string
              description: JWT Bearer firmado que debe enviarse en Authorization.
        success:
          type: boolean
          enum: [true]
        status:
          type: integer
          example: 200
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
          maxItems: 0
    DeleteResponse:
      type: object
      required: [data, success, status, errors]
      properties:
        data:
          type: object
          nullable: true
          example: null
        success:
          type: boolean
          enum: [true]
        status:
          type: integer
          example: 200
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
          maxItems: 0
    ErrorResponse:
      type: object
      required: [data, success, status, errors]
      properties:
        data:
          type: object
          nullable: true
          example: null
        success:
          type: boolean
          enum: [false]
        status:
          type: integer
          example: 400
        errors:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ErrorDetail"
  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: El nombre o correo ya existe
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Token ausente, inválido o vencido, o credenciales incorrectas
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Error interno
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
